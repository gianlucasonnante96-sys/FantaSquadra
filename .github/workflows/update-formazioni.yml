name: Aggiorna Probabili Formazioni

on:
  schedule:
    # Gira ogni 2 ore dalle 9:00 alle 23:00 ora italiana
    - cron: '0 7-21/2 * * *'
  workflow_dispatch: # Permette di lanciarlo a mano

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa dipendenze
        run: npm install

      - name: Installa Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Esegui lo scraper
        run: node scripts/scraper.js

      - name: Commit e push se ci sono cambiamenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/formazioni.json src/data/listone.json src/data/statistiche.json src/data/squadre.json
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Aggiorna formazioni, listone, statistiche e classifica [skip ci]"
            git push
          else
            echo "Nessun cambiamento da committare"
          fi
