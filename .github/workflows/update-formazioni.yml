name: Aggiorna Probabili Formazioni

on:
  schedule:
    # Gira 2 volte al giorno: mattina (9:00) e pomeriggio (17:00) ora italiana
    # UTC = ora italiana - 2 (o -1 con ora legale)
    - cron: '0 7 * * *'   # 09:00 ora italiana
    - cron: '0 15 * * *'  # 17:00 ora italiana
  workflow_dispatch: # Permette di lanciarlo a mano dal browser

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa dipendenze
        run: npm install

      - name: Installa Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Esegui lo scraper
        run: node scripts/scraper.js

      - name: Commit e push se ci sono cambiamenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/formazioni.json
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Aggiorna probabili formazioni [skip ci]"
            git push
          else
            echo "Nessun cambiamento da committare"
          fi
